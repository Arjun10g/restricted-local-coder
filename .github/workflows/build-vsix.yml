name: Build platform VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runtime_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime_key: win32-x64
            vsce_target: win32-x64
          - os: ubuntu-24.04
            runtime_key: linux-x64
            vsce_target: linux-x64
          - os: ubuntu-24.04-arm
            runtime_key: linux-arm64
            vsce_target: linux-arm64
          - os: macos-26
            runtime_key: darwin-arm64
            vsce_target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate source before native build
        run: npm run validate

      # Repackage the pinned upstream release instead of compiling it. Every
      # archive is checked against the SHA-256 in vendor/llama.cpp.lock.json
      # before it is unpacked, and --verify runs the binary afterwards. Building
      # from source remains available through scripts/ for governed rebuilds.
      - name: Fetch and verify the pinned runtime
        run: >-
          python tools/fetch-runtime.py
          --key ${{ matrix.runtime_key }}
          --verify

      # Windows does not ship the MSVC C/C++ runtime, the official llama.cpp zip
      # does not carry it either, and the target user has no administrator rights
      # to install the redistributable. Carry it in the VSIX so the runtime
      # directory is self-contained. Must run after the fetch step, which clears
      # its destination first.
      - name: Bundle the app-local MSVC runtime
        if: matrix.runtime_key == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'extension/runtime/win32-x64'
          $needed = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')

          $redist = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT' `
            -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($redist) { Write-Host "Redistributable source: $($redist.FullName)" }

          foreach ($name in $needed) {
            $source = $null
            if ($redist) {
              $candidate = Join-Path $redist.FullName $name
              if (Test-Path -LiteralPath $candidate) { $source = $candidate }
            }
            if (-not $source) {
              $candidate = Join-Path $env:SystemRoot "System32\$name"
              if (Test-Path -LiteralPath $candidate) { $source = $candidate }
            }
            if (-not $source) { throw "Could not locate $name to bundle into the VSIX." }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination $name) -Force
            Write-Host "bundled $name <- $source"
          }

          foreach ($name in $needed) {
            if (-not (Test-Path -LiteralPath (Join-Path $destination $name))) {
              throw "$name is missing from $destination after bundling."
            }
          }

      # Running the binary only proves the *build agent* could resolve its
      # imports, and these runners carry LLVM and Visual Studio. This reads the
      # PE import tables of what is about to be packaged and fails if anything
      # would be missing on a clean workstation. libomp140.x86_64.dll was absent
      # for exactly this reason and the running check did not notice.
      - name: Verify every Windows dependency is bundled
        if: matrix.runtime_key == 'win32-x64'
        run: >-
          python tools/fetch-runtime.py
          --key win32-x64
          --check-dependencies-only

      - name: Package platform-specific VSIX
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./extension/package.json').version")"
          mkdir -p artifacts
          cd extension
          npx --yes @vscode/vsce@3.9.2 package \
            --target '${{ matrix.vsce_target }}' \
            --out "../artifacts/restricted-local-coder-${VERSION}-${{ matrix.runtime_key }}.vsix" \
            --no-dependencies
          cd ..
          python - <<'PY'
          import hashlib, pathlib
          for file in pathlib.Path('artifacts').glob('*.vsix'):
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              file.with_suffix(file.suffix + '.sha256').write_text(f'{digest}  {file.name}\n', encoding='utf-8')
              print(file, digest)
          PY

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restricted-local-coder-${{ matrix.runtime_key }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: restricted-local-coder-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}'
          release-assets/*
          --repo '${{ github.repository }}'
          --generate-notes
          --title 'Restricted Local Coder ${{ github.ref_name }}'
