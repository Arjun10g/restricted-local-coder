name: Verify a published Windows release

# Proves that a release asset actually starts on a Windows machine that has
# nothing but Windows on its PATH. The regular build job runs llama-server on
# the runner with its full developer toolchain visible, which is precisely how
# a missing libomp140.x86_64.dll went unnoticed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to verify, without the leading v
        required: true
        default: '0.3.1'

permissions:
  contents: read

jobs:
  # The workstation runs powershell.exe, which is Windows PowerShell 5.1, and it
  # differs from PowerShell 7 in ways that matter here: stderr from a native
  # command raises NativeCommandError when ErrorActionPreference is Stop, and a
  # .ps1 without a byte-order mark is read as Windows-1252. Neither reproduces on
  # a developer machine running pwsh, so the bootstrap is exercised here instead.
  bootstrap-windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the interpreter really is 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }

      - name: Stub the VS Code CLI so it is chatty on stderr, as the real one is
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\stub | Out-Null
          $lines = @(
            '@echo off',
            'echo DeprecationWarning: punycode is deprecated 1>&2',
            'if "%1"=="--uninstall-extension" (',
            '  echo Extension is not installed. 1>&2',
            '  exit /b 1',
            ')',
            'echo Extension was successfully installed.',
            'exit /b 0'
          )
          Set-Content -LiteralPath C:\stub\code.cmd -Value $lines -Encoding ASCII
          Get-Content C:\stub\code.cmd

      - name: Run the bootstrap end to end under 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\stub;$env:PATH"
          New-Item -ItemType Directory -Force -Path C:\wstest | Out-Null
          # -File is how the documented command invokes it, so use the same form.
          powershell -ExecutionPolicy Bypass -File scripts\Start-Workstation.ps1 `
            -WorkDir C:\wstest `
            -SettingsPath C:\wstest\settings.json
          if ($LASTEXITCODE -ne 0) {
            throw "The bootstrap exited $LASTEXITCODE under Windows PowerShell 5.1"
          }
          Write-Host 'Bootstrap completed under Windows PowerShell 5.1.' -ForegroundColor Green

      - name: Confirm it wrote the settings it claims to
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Get-Content C:\wstest\settings.json -Raw | ConvertFrom-Json
          $settings | ConvertTo-Json -Depth 5
          foreach ($key in @('localCoder.modelProfile', 'localCoder.modelMirrorBaseUrl')) {
            if (-not $settings.PSObject.Properties.Name.Contains($key)) {
              throw "$key was not written"
            }
          }

  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify the published VSIX
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $name = "restricted-local-coder-$env:VERSION-win32-x64.vsix"
          $base = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Invoke-WebRequest -Uri "$base/$name" -OutFile "artifacts/$name" -UseBasicParsing

          $sidecar = (Invoke-WebRequest -Uri "$base/$name.sha256" -UseBasicParsing).Content
          if ($sidecar -is [byte[]]) { $sidecar = [System.Text.Encoding]::UTF8.GetString($sidecar) }
          $expected = (([string]$sidecar -split '\s+') | Where-Object { $_ })[0]
          $actual = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          "expected $expected"
          "actual   $actual"
          if ($actual -ne $expected.ToLower()) { throw 'Published VSIX does not match its sidecar digest.' }

      - name: Unpack it the way VS Code would
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "restricted-local-coder-$env:VERSION-win32-x64.vsix"
          # Install outside the workspace, so nothing in the checkout can satisfy
          # a dependency by accident.
          $install = Join-Path $env:TEMP 'localcoder-install'
          Remove-Item -Recurse -Force $install -ErrorAction SilentlyContinue
          Expand-Archive -Path "artifacts/$name" -DestinationPath $install -Force
          $runtime = Join-Path $install 'extension\runtime\win32-x64'
          "runtime: $runtime"
          Get-ChildItem $runtime | Select-Object Name, Length | Format-Table -AutoSize
          "LOCALCODER_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check every import resolves
        run: >-
          python tools/fetch-runtime.py
          --key win32-x64
          --destination "${{ env.LOCALCODER_RUNTIME }}"
          --check-dependencies-only

      - name: Start it with only Windows on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $server = Join-Path $env:LOCALCODER_RUNTIME 'llama-server.exe'

          # Strip the runner's toolchain from PATH. Anything the server needs must
          # now come from its own directory or from Windows itself, which is the
          # situation on the target workstation.
          $clean = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          "PATH for this step: $clean"

          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = $server
          $psi.Arguments = '--version'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables['PATH'] = $clean
          $p = [Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEnd()
          $err = $p.StandardError.ReadToEnd()
          $p.WaitForExit(60000) | Out-Null

          "exit code: $($p.ExitCode)"
          "--- stdout ---"; $out
          "--- stderr ---"; $err

          if ($p.ExitCode -ne 0) {
            throw "llama-server --version exited $($p.ExitCode) with a Windows-only PATH. That is the failure a workstation sees."
          }
          Write-Host 'llama-server started and reported its version with no developer tooling on PATH.' -ForegroundColor Green
